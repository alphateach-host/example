<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(
            180deg,
            #ffffff 0%,
            #f7f7f7 35%,
            #ececec 100%
            );
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
            color: #222;
            display: flex;
            flex-direction: column;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 999;

            display: flex;
            align-items: center;

            padding: 14px 12px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(8px);

            border-bottom: 1px solid rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }
        header .logo {
            width: 46px;
            height: 46px;
            object-fit: contain;
            margin-right: 10px;
            transition: all 0.3s ease;
        }
        header .member-info h1 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            color: #111;
            line-height: 1.2;
            transition: all 0.3s ease;
        }
        header .member-info span {
            display: block;
            margin-top: 2px;
            font-size: 11px;
            color: #666;
            transition: all 0.3s ease;
        }
        header.scrolled {
            padding: 8px 12px;
            background: rgba(255,255,255,0.82);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        header.scrolled .logo {
            width: 34px;
            height: 34px;
        }
        header.scrolled .member-info h1 {
            font-size: 14px;
        }
        header.scrolled .member-info span {
            font-size: 10px;
        }

        main {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;

            display: flex;
            justify-content: center;
        }

        .catalog-grid {
            width: 100%;

            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 200px));
            justify-content: center;
            gap: 12px;
        }

        .catalog-item {
            width: 100%;
            max-width: 200px;

            background: #fff;
            border-radius: 12px;
            overflow: hidden;

            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

.center-item {
    grid-column: span 2;
    justify-self: center;
}

        .catalog-item img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            display: block;
            cursor: pointer;
        }

        .catalog-item img {
            width: 100%;
            display: block;
            object-fit: cover;
            cursor: pointer;
        }

        /* Modal */
        .image-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;

            background: rgba(0,0,0,0.25);
            backdrop-filter: blur(4px);

            justify-content: center;
            align-items: center;

            padding: 16px;
            box-sizing: border-box;
        }

        .modal-box {
            width: 90vw;
            max-width: 380px;
            border-radius: 16px;
            overflow: hidden;

            box-shadow: 0 8px 30px rgba(0,0,0,0.18);
            animation: fadeUp 0.25s ease;
        }

        .img-container {
            position: relative;
            width: 100%;
            height: 500px;
            background: #fff;
        }

        .modal-content {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .wa-btn {
            position: absolute;
            left: 12px;
            right: 12px;
            bottom: 12px;

            text-align: center;
            text-decoration: none;

            padding: 14px;
            border-radius: 12px;

            background: rgba(37,211,102,0.88);
            backdrop-filter: blur(8px);

            color: white;
            font-weight: bold;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #111;
            font-size: 28px;
            cursor: pointer;
            z-index: 10000;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px) scale(.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .footer {
            padding: 24px 16px 32px;
        }

        .footer-card {
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(12px);

            border: 1px solid rgba(255,255,255,0.6);
            border-radius: 22px;

            padding: 24px 18px;
            text-align: center;

            box-shadow:
            0 8px 24px rgba(0,0,0,0.06),
            inset 0 1px 0 rgba(255,255,255,0.7);
        }

        .footer-card h3 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            color: #111;
        }

        .footer-card p {
            margin: 10px 0 20px;
            font-size: 14px;
            line-height: 1.6;
            color: #666;
        }

        /* CTA */
        .footer-wa {
            display: inline-block;
            width: 100%;
            max-width: 300px;

            padding: 14px 18px;
            box-sizing: border-box;

            text-decoration: none;
            font-weight: 600;
            font-size: 15px;

            color: white;
            border-radius: 14px;

            background: linear-gradient(135deg, #25D366, #1ebe5d);

            box-shadow: 0 8px 18px rgba(37,211,102,0.28);
        }
    </style>
</head>
<body>

            </p>

            <a href="https://wa.me/6281234567890" class="footer-wa" target="_blank">
                Chat via WhatsApp
            </a>

        </div>
    </footer>

    <script>
        window.addEventListener("scroll", function () {
            const header = document.querySelector("header");

            if (window.scrollY > 30) {
                header.classList.add("scrolled");
            } else {
                header.classList.remove("scrolled");
            }
        });

        const modal = document.getElementById("imageModal");
        const modalImg = document.getElementById("modalImg");
        const waBtn = document.getElementById("waBtn");
        const images = document.querySelectorAll(".catalog-item img");
        const closeBtn = document.querySelector(".close-btn");

        images.forEach(img => {
            img.addEventListener("click", () => {
                modal.style.display = "flex";
                modalImg.src = img.src;

                const productName = img.alt || "Produk";
                const phone = "6281234567890";

                waBtn.href =
                `https://wa.me/${phone}?text=Saya%20tertarik%20dengan%20${encodeURIComponent(productName)}`;
            });
        });

        closeBtn.addEventListener("click", () => {
            modal.style.display = "none";
        });

        modal.addEventListener("click", (e) => {
            if (e.target === modal) {
                modal.style.display = "none";
            }
        });
    </script>

    <script>
        function centerLastRow() {
    const grid = document.querySelector('.catalog-grid');
    const items = document.querySelectorAll('.catalog-item');

    items.forEach(item => item.classList.remove('center-item'));

    const itemWidth = 220;
    const gap = 12;

    const cols = Math.floor((grid.clientWidth + gap) / (itemWidth + gap));
    const remainder = items.length % cols;

    if (remainder === 1 && cols > 1) {
        items[items.length - 1].classList.add('center-item');
    }
}
    </script>
